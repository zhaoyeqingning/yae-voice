<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" />
    <title>Evanescia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Outfit:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=9" />
  </head>
  <body>
    <div class="wash" aria-hidden="true"><span></span><span></span></div>
    <div class="app">
      <aside class="drawer" id="drawer" hidden>
        <div class="drawer-card">
          <div class="avatar avatar-lg" aria-hidden="true"><img src="/static/avatar.jpg" alt="" /></div>
          <h2>Evanescia</h2>
          <p>面对面说一会儿。打字，或者进通话。</p>
          <button type="button" class="text-btn" id="btn-clear">清空这段</button>
        </div>
      </aside>
      <div class="drawer-mask" id="drawer-mask" hidden></div>

      <div class="shell">
        <header class="top">
          <button type="button" class="icon-btn" id="btn-drawer" aria-label="关于她">
            <span class="avatar" aria-hidden="true"><img src="/static/avatar.jpg" alt="" /></span>
          </button>
          <div class="who">
            <h1>Evanescia</h1>
            <p id="status">在线</p>
          </div>
        </header>

        <main class="stage" id="stage">
          <section class="empty" id="empty">
            <div class="avatar avatar-xl" aria-hidden="true"><img src="/static/avatar.jpg" alt="" /></div>
            <h2>Evanescia</h2>
            <p class="lede">我在。想说什么，直接打，或者进来跟我说话。</p>
            <div class="starters" id="starters">
              <button type="button" data-prompt="今天过得怎么样">今天过得怎么样</button>
              <button type="button" data-prompt="陪我待一会儿">陪我待一会儿</button>
              <button type="button" data-prompt="用一句话介绍你自己">用一句话介绍你自己</button>
              <button type="button" data-prompt="随便说点什么">随便说点什么</button>
            </div>
          </section>
          <div class="thread" id="thread" hidden></div>
        </main>

        <div class="dock">
          <button type="button" class="call-entry" id="btn-call" aria-label="通话">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M7.5 3.8c.4-.4 1-.5 1.5-.2l2.2 1.3c.5.3.7.9.5 1.4L10.6 9c-.1.4 0 .8.3 1.1l3 3c.3.3.7.4 1.1.3l2.7-1.1c.5-.2 1.1 0 1.4.5l1.3 2.2c.3.5.2 1.1-.2 1.5l-1.3 1.3c-.6.6-1.5.9-2.4.7-2.3-.5-5.4-2.2-8.1-4.9S4.1 9.4 3.6 7.1c-.2-.9.1-1.8.7-2.4L7.5 3.8z"
              />
            </svg>
          </button>
          <form class="composer" id="composer">
            <textarea
              id="input"
              rows="1"
              maxlength="500"
              placeholder="说点什么"
              aria-label="消息"
            ></textarea>
            <button type="submit" id="btn-send" aria-label="发送" disabled>
              <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V6M6.5 11.5 12 6l5.5 5.5" />
              </svg>
              <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true" hidden>
                <rect x="7" y="7" width="10" height="10" rx="1.5" />
              </svg>
            </button>
          </form>
        </div>
        <button type="button" class="jump" id="btn-jump" hidden>回到底部</button>
      </div>

      <section class="call" id="call" hidden aria-label="通话">
        <button type="button" class="call-close" id="btn-hangup" aria-label="挂断">收起</button>
        <div class="call-body">
          <div class="orb" id="orb">
            <span class="ring"></span>
            <span class="ring"></span>
            <span class="ring"></span>
            <div class="avatar avatar-xl"><img src="/static/avatar.jpg" alt="" /></div>
          </div>
          <h2>Evanescia</h2>
          <p class="call-status" id="call-status">按住说话</p>
          <p class="caption" id="caption"></p>
        </div>
        <div class="call-controls">
          <button type="button" class="hold" id="btn-hold">按住说话</button>
        </div>
      </section>
    </div>
    <script src="/static/app.js?v=6" type="module"></script>
  </body>
</html>
